<script>/* Gidi Maps, 3D view: the same city data (window.GIDI) as extruded buildings, raised flyovers and flat ground,
   drawn with three.js r147 (UMD) and MapControls. Map metres: x east, y south. Three.js: X = x, Z = y, Y = up.
   Exposes window.GidiView3D (a React component) for app.js. */
(function () {
  const { useEffect, useRef, useState } = React;
  const h = React.createElement;
  const G = window.GIDI;
  const STOREY = 3.1;

  function tokens() {
    const cs = getComputedStyle(document.documentElement);
    const v = (n, f) => (cs.getPropertyValue(n).trim() || f);
    const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.getAttribute("data-theme") !== "light" || document.documentElement.getAttribute("data-theme") === "dark";
    return {
      dark, bush: v("--bush", "#e7eadb"), land: v("--land", "#f5f3ee"), water: v("--water", "#a9d3f5"), ocean: v("--ocean", "#9fcbef"),
      st: v("--st", "#ffffff"), mn: v("--mn", "#ffffff"), ar: v("--ar", "#f5c542"), bridge: v("--bridge", "#e6e1d6"),
      market: v("--p-market", "#f6dfc2"), industrial: v("--p-industrial", "#e3e3e6"), school: v("--p-school", "#f3ebc4"), pitch: v("--p-pitch", "#cfe8c4"), park: v("--p-park", "#d9dde8"),
      sky: dark ? "#1c232c" : "#dfe8ef", a1: v("--a1", "#1e8e3e"), a2: v("--a2", "#c98400"), a3: v("--a3", "#d93025"),
    };
  }
  const C = (s) => new THREE.Color(s);

  // ---------- geometry helpers ----------
  function flatPoly(rings, y) {   // rings: [outer, ...holes] in map metres
    const sh = new THREE.Shape(rings[0].map((p) => new THREE.Vector2(p[0], p[1])));
    for (const hole of rings.slice(1)) sh.holes.push(new THREE.Path(hole.map((p) => new THREE.Vector2(p[0], p[1]))));
    const g = new THREE.ShapeGeometry(sh); g.rotateX(Math.PI / 2); g.translate(0, y, 0); return g;
  }
  function ribbon(lines, width, y, out) {   // flat strips along polylines; appends triangles to out (array of numbers)
    const hw = width / 2;
    for (const pts of lines) for (let i = 0; i < pts.length - 1; i++) {
      const [x0, z0] = pts[i], [x1, z1] = pts[i + 1]; const L = Math.hypot(x1 - x0, z1 - z0); if (L < 0.01) continue;
      const nx = -(z1 - z0) / L * hw, nz = (x1 - x0) / L * hw;
      // extend a little past each joint so corners don't gap
      const ex = (x1 - x0) / L * hw * 0.9, ez = (z1 - z0) / L * hw * 0.9;
      const a = [x0 - ex + nx, z0 - ez + nz], b = [x0 - ex - nx, z0 - ez - nz], c = [x1 + ex - nx, z1 + ez - nz], d = [x1 + ex + nx, z1 + ez + nz];
      out.push(a[0], y, a[1], b[0], y, b[1], c[0], y, c[1], a[0], y, a[1], c[0], y, c[1], d[0], y, d[1]);
    }
    return out;
  }
  function geomFrom(pos, col) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    if (col) g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals(); return g;
  }
  function hash(i) { let x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // walls and roofs for every generated building, one merged mesh
  function buildings(T) {
    const pos = [], col = [];
    const walls = T.dark ? ["#6d6a66", "#75706a", "#6a6f72", "#7a7369"] : ["#e9e2d6", "#e3d9c8", "#dcdcd6", "#e6dccd", "#d9d2c4"];
    const tin = T.dark ? ["#6e4a3a", "#5f4d42", "#6b6560"] : ["#a3684a", "#8f5f47", "#9a8f84", "#b07a58"];
    const flat = T.dark ? "#77746f" : "#cfcac0";
    const special = { warehouse: T.dark ? "#5d6670" : "#b9c0c8", stalls: T.dark ? "#8a5b2e" : "#d69a55", school: T.dark ? "#7b6a3c" : "#e1c46a", kiosk: T.dark ? "#4f6a86" : "#7ea2c6", shed: T.dark ? "#5b5650" : "#a59d92" };
    let n = 0;
    const tmp = new THREE.Color();
    for (const [id, list] of Object.entries(G.buildings || {})) {
      const st = (G.storeys || {})[id] || [];
      list.forEach((b, i) => {
        n++;
        const kind = b[0], ring = b.slice(1); const s = st[i] || 1;
        const H = kind === "stalls" ? 3 : kind === "kiosk" ? 2.6 : kind === "shed" ? 2.6 : s * STOREY + (s <= 2 ? 0.6 : 0.3);
        const wallC = special[kind] || walls[Math.floor(hash(n) * walls.length)];
        const roofC = special[kind] || (s <= 2 && hash(n + 7) < 0.62 ? tin[Math.floor(hash(n + 3) * tin.length)] : flat);
        const k = ring.length;
        for (let j = 0; j < k; j++) {   // walls, darker at the foot for a little depth
          const [x0, z0] = ring[j], [x1, z1] = ring[(j + 1) % k];
          pos.push(x0, 0, z0, x1, 0, z1, x1, H, z1, x0, 0, z0, x1, H, z1, x0, H, z0);
          tmp.set(wallC); const top = [tmp.r, tmp.g, tmp.b]; tmp.multiplyScalar(0.72); const bot = [tmp.r, tmp.g, tmp.b];
          col.push(...bot, ...bot, ...top, ...bot, ...top, ...top);
        }
        tmp.set(roofC);
        for (let j = 1; j < k - 1; j++) {   // roof fan
          pos.push(ring[0][0], H, ring[0][1], ring[j + 1][0], H, ring[j + 1][1], ring[j][0], H, ring[j][1]);
          col.push(tmp.r, tmp.g, tmp.b, tmp.r, tmp.g, tmp.b, tmp.r, tmp.g, tmp.b);
        }
      });
    }
    const m = new THREE.Mesh(geomFrom(pos, col), new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    m.userData.count = n; return m;
  }

  // flyovers (decks on pillars), skywalks and canal footbridges
  function structures(T) {
    const group = new THREE.Group();
    const deckM = new THREE.MeshLambertMaterial({ color: C(T.dark ? "#6b6f75" : "#e4dfd5"), side: THREE.DoubleSide });
    const sideM = new THREE.MeshLambertMaterial({ color: C(T.dark ? "#4b4f55" : "#b9b3a8"), side: THREE.DoubleSide });
    for (const s of G.structures || []) {
      const y = s.kind === "skywalk" ? 6.5 : s.kind === "footbridge" ? 1.2 : 7 * (s.layer || 1);
      const top = ribbon([s.pts], s.width, y, []);
      group.add(new THREE.Mesh(geomFrom(top), deckM));
      // deck edge (a strip hanging 1.2 m below each side) and pillars every ~28 m
      const pts = s.pts, edge = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const [x0, z0] = pts[i], [x1, z1] = pts[i + 1]; const L = Math.hypot(x1 - x0, z1 - z0); if (!L) continue;
        const nx = -(z1 - z0) / L * s.width / 2, nz = (x1 - x0) / L * s.width / 2;
        for (const sg of [1, -1]) {
          const ax = x0 + nx * sg, az = z0 + nz * sg, bx = x1 + nx * sg, bz = z1 + nz * sg;
          const lip = Math.min(1.2, y);
          edge.push(ax, y, az, bx, y, bz, bx, y - lip, bz, ax, y, az, bx, y - lip, bz, ax, y - lip, az);
        }
        if (s.kind === "flyover") for (let t = 14; t < L; t += 28) {
          const p = new THREE.Mesh(new THREE.BoxGeometry(2.2, y - 1.2, 2.2), sideM);
          p.position.set(x0 + (x1 - x0) * t / L, (y - 1.2) / 2, z0 + (z1 - z0) * t / L); group.add(p);
        }
      }
      group.add(new THREE.Mesh(geomFrom(edge), sideM));
    }
    return group;
  }

  function buildScene(T) {
    const scene = new THREE.Scene();
    scene.background = C(T.sky);
    scene.fog = new THREE.Fog(T.sky, 9000, 26000);
    scene.add(new THREE.HemisphereLight(T.dark ? 0x9fb3c8 : 0xffffff, T.dark ? 0x2a2d31 : 0xd9d2c3, T.dark ? 0.6 : 0.62));
    const sun = new THREE.DirectionalLight(0xffffff, T.dark ? 0.4 : 0.42); sun.position.set(-0.6, 1, -0.35); scene.add(sun);

    const [MW, MH] = G.size;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(MW + 30000, MH + 30000), new THREE.MeshLambertMaterial({ color: C(T.bush) }));
    ground.rotation.x = -Math.PI / 2; ground.position.set(MW / 2, -0.3, MH / 2); scene.add(ground);
    const flatM = (c) => new THREE.MeshLambertMaterial({ color: C(c), side: THREE.DoubleSide });
    for (const r of G.ocean) scene.add(new THREE.Mesh(flatPoly([r], 0.05), flatM(T.ocean)));
    scene.add(new THREE.Mesh(flatPoly(G.water, 0.1), flatM(T.water)));

    const pick = [];
    for (const d of G.districts) {
      const tint = C(T.land).lerp(C(T["a" + d.act]), T.dark ? 0.1 : 0.07);
      const m = new THREE.Mesh(flatPoly(d.poly, 0.2), new THREE.MeshLambertMaterial({ color: tint, side: THREE.DoubleSide }));
      m.userData.district = d.id; scene.add(m); pick.push(m);
    }
    const PC = { market: T.market, "under-bridge": T.market, industrial: T.industrial, station: T.industrial, school: T.school, pitch: T.pitch, stadium: T.pitch, "motor park": T.park, "bus-terminal": T.park, "bus terminal": T.park, estate: T.pitch };
    for (const list of Object.values(G.parcels || {})) for (const p of list) scene.add(new THREE.Mesh(flatPoly([p.pts], 0.35), flatM(PC[p.kind] || T.industrial)));

    const lanes = [], streets = [], mains = [], arts = [];
    for (const list of Object.values(G.lanes || {})) ribbon(list, 3, 0.45, lanes);
    for (const list of Object.values(G.streets)) ribbon(list, 6, 0.5, streets);
    ribbon(G.mains.map((m) => m.pts), 10, 0.55, mains);
    ribbon(G.arterials.filter((a) => a.cls !== "bridge").map((a) => a.pts), 22, 0.6, arts);
    const roadM = (c) => new THREE.MeshLambertMaterial({ color: C(c), side: THREE.DoubleSide });
    scene.add(new THREE.Mesh(geomFrom(lanes), roadM(T.st)));
    scene.add(new THREE.Mesh(geomFrom(streets), roadM(T.st)));
    scene.add(new THREE.Mesh(geomFrom(mains), roadM(T.mn)));
    scene.add(new THREE.Mesh(geomFrom(arts), roadM(T.ar)));
    // water bridges ride above the lagoon
    const br = []; ribbon(G.arterials.filter((a) => a.cls === "bridge").map((a) => a.pts), 24, 9, br);
    scene.add(new THREE.Mesh(geomFrom(br), roadM(T.bridge)));
    // rail: dark ballast with a light centre line
    scene.add(new THREE.Mesh(geomFrom(ribbon([G.rail.pts], 7, 0.65, [])), roadM(T.dark ? "#3a3e44" : "#8f8b84")));
    scene.add(new THREE.Mesh(geomFrom(ribbon([G.rail.pts], 1.6, 0.7, [])), roadM(T.dark ? "#8a8f96" : "#d8d4cc")));
    for (const c of G.canals || []) scene.add(new THREE.Mesh(geomFrom(ribbon([c.pts], 4, 0.62, [])), roadM(T.water)));   // 4 m of water; the banks are walkable
    const foot = []; for (const list of Object.values(G.paths || {})) ribbon(list, 1.5, 0.66, foot);
    scene.add(new THREE.Mesh(geomFrom(foot), roadM(T.dark ? "#7a6a55" : "#c9b48f")));
    if (G.boardwalks) scene.add(new THREE.Mesh(geomFrom(ribbon(G.boardwalks, 2.5, 1.2, [])), roadM(T.dark ? "#7a6a55" : "#b59b76")));

    const b = buildings(T); scene.add(b);
    scene.add(structures(T));
    return { scene, pick, buildingCount: b.userData.count };
  }

  function bboxOf(pts) { let a = [1e9, 1e9, -1e9, -1e9]; for (const [x, y] of pts) a = [Math.min(a[0], x), Math.min(a[1], y), Math.max(a[2], x), Math.max(a[3], y)]; return a; }

  // ---------- the React component ----------
  function View3D({ sel, select, onReady }) {
    const host = useRef(null), labels = useRef(null);
    const api = useRef(null);
    const [info, setInfo] = useState(null);

    useEffect(() => {
      const el = host.current;
      const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      el.appendChild(renderer.domElement);
      const camera = new THREE.PerspectiveCamera(40, 1, 2, 60000);
      const controls = new THREE.MapControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.12; controls.screenSpacePanning = false;
      controls.maxPolarAngle = 1.32; controls.minDistance = 60; controls.maxDistance = 20000;

      let world = null;
      const build = () => {
        if (world) world.scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
        world = buildScene(tokens());
        setInfo({ built: Object.keys(G.buildings || {}).length, total: G.districts.length, count: world.buildingCount });
      };
      build();

      const [MW, MH] = G.size;
      const lookAt = (bb, instant) => {
        if (el.clientWidth > 760) { const w = bb[2] - bb[0]; bb = [bb[0] - w * 0.42, bb[1], bb[2], bb[3]]; }   // keep it clear of the side panel
        const cx = (bb[0] + bb[2]) / 2, cz = (bb[1] + bb[3]) / 2, span = Math.max(bb[2] - bb[0], bb[3] - bb[1], 300);
        const dist = span * 1.15;
        const to = { t: new THREE.Vector3(cx, 0, cz), p: new THREE.Vector3(cx - dist * 0.25, dist * 0.78, cz + dist * 0.62) };
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (instant || reduce) { controls.target.copy(to.t); camera.position.copy(to.p); controls.update(); return; }
        const from = { t: controls.target.clone(), p: camera.position.clone() }, t0 = performance.now();
        fly = (now) => { const k = Math.min(1, (now - t0) / 700), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
          controls.target.lerpVectors(from.t, to.t, e); camera.position.lerpVectors(from.p, to.p, e); if (k >= 1) fly = null; };
      };
      let fly = null;
      lookAt([0, 0, MW, MH * 0.95], true);

      const resize = () => { const w = el.clientWidth, hh = el.clientHeight; renderer.setSize(w, hh); camera.aspect = w / hh; camera.updateProjectionMatrix(); };
      const ro = new ResizeObserver(resize); ro.observe(el); resize();

      // labels: district names far out, landmarks up close
      const LBL = G.districts.map((d) => { const b = bboxOf(d.poly[0]); return { kind: "d", id: d.id, text: d.name, x: (b[0] + b[2]) / 2, z: (b[1] + b[3]) / 2, act: d.act }; })
        .concat(G.pois.map((p, i) => ({ kind: "p", id: i, text: p.name, x: p.x, z: p.y, type: p.type, civic: !!p.civic })).filter((l) => !l.civic));
      const lblEls = LBL.map((l) => {
        const b = document.createElement("button");
        b.className = l.kind === "d" ? "dlabel ui a" + l.act : "poi ui t-" + l.type;
        b.innerHTML = l.kind === "d" ? `<span class="dn"></span>` : `<span class="pin"></span><span class="plabel"></span>`;
        if (l.kind === "d") b.querySelector(".dn").textContent = l.text;
        else { b.querySelector(".pin").textContent = (window.GIDI_TYPE && window.GIDI_TYPE[l.type] || {}).glyph || "•"; b.querySelector(".plabel").textContent = l.text; }

      return INDEX.filter((r) => r.name.toLowerCase().includes(s) || r.sub.toLowerCase().includes(s)).slice(0, 8);
    }, [q]);

    if (!view) return h("div", { ref: wrap, className: "map" });
    const z = view.z;
    const zb = Math.round(Math.log2(z) * 4) / 4;
    const sx = (x) => (x - view.cx) * z + size.w / 2, sy = (y) => (y - view.cy) * z + size.h / 2;
    const selDistrict = sel && sel.kind === "district" ? sel.id : sel && sel.kind === "poi" ? G.pois[sel.id].d : null;

    // scale bar
    const nice = [50, 100, 200, 250, 500, 1000, 2000, 5000];
    const metres = nice.find((n) => n * z > 70) || 5000;
    const scaleLabel = metres >= 1000 ? metres / 1000 + " km" : metres + " m";

    const showPlaces = layers.places && z > 0.17;
    const showPoiLabels = z > 0.3;
    const showCivic = layers.civic && z > 0.32;
    const showCivicLabels = z > 0.75;

    const TOPBAR = () =>
      h("div", { className: "topbar ui" },
        h("div", { className: "search" + (focusSearch && results.length ? " open" : "") },
          h("div", { className: "brand" }, "Gidi"),
          h("input", { id: "search", type: "search", placeholder: "Search districts, places, roads", value: q, autoComplete: "off",
            onChange: (e) => setQ(e.target.value), onFocus: () => setFocusSearch(true), onBlur: () => setTimeout(() => setFocusSearch(false), 150),
            onKeyDown: (e) => { if (e.key === "Enter" && results[0]) { select(results[0]); setQ(""); e.target.blur(); } } }),
          focusSearch && results.length > 0 && h("ul", { className: "results" },
            results.map((r) => h("li", { key: r.kind + r.id },
              h("button", { onMouseDown: (e) => e.preventDefault(), onClick: () => { select(r); setQ(""); document.activeElement.blur(); } },
                h("span", { className: "rn" }, r.name), h("span", { className: "rs" }, r.sub)))))),
        h("div", { className: "chips" },
          [["acts", "Acts"], ["okada", "Okada zones"], ["places", "Landmarks"], ["civic", "Civic"], ["rail", "Rail"], ["ferries", "Ferries"], ["names", "Street names"]].map(([k, t]) =>
            h("button", { key: k, className: "chip" + (layers[k] ? " on" : ""), "aria-pressed": layers[k], onClick: () => setLayers({ ...layers, [k]: !layers[k] }) }, t))));
    const is3d = dim === "3d";
    const dimBox = h("div", { className: "dim ui" },
      h("div", { className: "seg", role: "group", "aria-label": "Map view" },
        h("button", { id: "dim2d", "aria-pressed": !is3d, onClick: () => setDim("2d") }, "2D"),
        h("button", { id: "dim3d", "aria-pressed": is3d, onClick: () => setDim("3d") }, "3D")),
      is3d && h("button", { className: "compass", "aria-label": "Turn the map to face north", onClick: () => api3d.current && api3d.current.north() }, h("span", { id: "compass3d" })));
    const controls3d = h("div", { className: "controls ui" },
      h("button", { "aria-label": "Zoom in", onClick: () => api3d.current && api3d.current.zoom(0.62) }, "+"),
      h("button", { "aria-label": "Zoom out", onClick: () => api3d.current && api3d.current.zoom(1.6) }, "−"),
      h("button", { "aria-label": "Show all of Gidi", className: "fit", onClick: () => api3d.current && api3d.current.home() }, "⤢"));
    if (is3d) return h("div", { ref: wrap, className: "map" },
      h(window.GidiView3D, { sel, select: (item) => { setSel(item); if (item) setPanelOpen(true); }, onReady: (a) => { api3d.current = a; } }),
      TOPBAR(),
      h(Panel, { sel, select, open: panelOpen, setOpen: setPanelOpen, close: () => setSel(null) }),
      dimBox, controls3d);

    return h("div", { ref: wrap, className: "map", onPointerDown: onDown, onPointerMove: onMove, onPointerUp: onUp, onPointerCancel: onUp, onDoubleClick: onDbl },
      h("svg", { className: "canvas", width: size.w, height: size.h, role: "img", "aria-label": "Map of Gidi" },
        h("defs", null,
          h("pattern", { id: "hatch", width: 8, height: 8, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" },
            h("rect", { width: 2.2, height: 8, className: "hatch-line" }))),
        h("g", { transform: `translate(${size.w / 2} ${size.h / 2}) scale(${z}) translate(${-view.cx} ${-view.cy})` },
          h(Base, { zb, layers, selected: selDistrict }))),
      // overlay labels (constant pixel size)
      h("div", { className: "overlay" },
        G.labels.map((l, i) => h("div", { key: "l" + i, className: "lbl " + l.k, style: { left: sx(l.x), top: sy(l.y) } }, l.t)),
        z < 0.75 && G.districts.map((d) => {
          const [cx, cy] = CENT[d.id]; const o = LABEL_AT[d.id] || [0, 0];
          return h("button", { key: d.id, className: "dlabel ui a" + d.act + (selDistrict === d.id ? " on" : ""), style: { left: sx(cx + o[0]), top: sy(cy + o[1]) },
            onClick: () => select({ kind: "district", id: d.id }) },
            h("span", { className: "dn" }, d.name), z > 0.1 && h("span", { className: "dsub" }, d.area.toFixed(1) + " km²"));
        }),
        G.pois.map((p, i) => {
          const isSel = sel && sel.kind === "poi" && sel.id === i;
          const civic = !!p.civic;
          if (!isSel && (civic ? !showCivic : !showPlaces)) return null;
          const x = sx(p.x), y = sy(p.y);
          if (x < -40 || y < -40 || x > size.w + 40 || y > size.h + 40) return null;
          return h("button", { key: "p" + i, className: "poi ui t-" + p.type + (civic ? " civic" : "") + (isSel ? " on" : ""), style: { left: x, top: y },
            onClick: () => select({ kind: "poi", id: i }), "aria-label": p.name },
            h("span", { className: "pin" }, TYPE[p.type].glyph),
            ((civic ? showCivicLabels : showPoiLabels) || isSel) && h("span", { className: "plabel" }, p.name));
        })),
      // search
      TOPBAR(),
      // side panel
      h(Panel, { sel, select, open: panelOpen, setOpen: setPanelOpen, close: () => setSel(null) }),
      // controls
      h("div", { className: "controls ui" },
        h("button", { "aria-label": "Zoom in", onClick: () => zoomAt(size.w / 2, size.h / 2, 1.6) }, "+"),
        h("button", { "aria-label": "Zoom out", onClick: () => zoomAt(size.w / 2, size.h / 2, 1 / 1.6) }, "−"),
        h("button", { "aria-label": "Show all of Gidi", className: "fit", onClick: () => flyTo(fit([0, 0, MW, MH * 0.97], 24)) }, "⤢")),
      dimBox,
      h("div", { className: "scale ui" },
        h("div", { className: "bar", style: { width: metres * z } }), h("span", null, scaleLabel),
        cursor && h("span", { className: "coord" }, `${(cursor[0] / 1000).toFixed(2)} km E · ${((MH - cursor[1]) / 1000).toFixed(2)} km N`)),
      h("div", { className: "credit ui" }, "Gidi map v0.3 · invented city inspired by Lagos · schematic, not to build from street by street"));
  }

  /* ---------- side panel ---------- */
  function Panel({ sel, select, open, setOpen, close }) {
    let body;
    if (!sel) body = h(Overview, { select });
    else if (sel.kind === "district") body = h(District, { d: byId[sel.id], select });
    else if (sel.kind === "poi") {
      const p = G.pois[sel.id]; const d = byId[p.d];
      body = h("div", { className: "card" },
        h("div", { className: "eyebrow t-" + p.type }, TYPE[p.type].label),
        h("h2", null, p.name),
        h("p", { className: "lead" }, p.note),
        h("button", { className: "link", onClick: () => select({ kind: "district", id: d.id }) }, "In " + d.name + " →"),
        h("div", { className: "chiprow" }, h("span", { className: "tag a" + d.act }, ACT_NAME[d.act]), h("span", { className: "tag ok-" + d.okada }, OKADA[d.okada].label),
          TYPE[p.type].safe && h("span", { className: "tag safe" }, "Safe ground: never a crime location")));
    } else if (sel.kind === "road") {
      const a = G.arterials[sel.id];
      body = h("div", { className: "card" }, h("div", { className: "eyebrow" }, "Main road"), h("h2", null, a.name),
        h("p", { className: "lead" }, a.cls === "bridge" ? "Bridge. Okada are banned on Gidi's bridges; the taskforce can seize the bike." : a.cls === "exp" ? "Expressway: trucks, tankers, danfos, go-slow at rush hour." : "Arterial road linking districts."));
    } else {
      const m = G.mains[sel.id]; const d = byId[m.d];
      body = h("div", { className: "card" }, h("div", { className: "eyebrow" }, "Street"), h("h2", null, m.name),
        h("p", { className: "lead" }, "A main street of " + d.name + ". Street names are placeholders."),
        h("button", { className: "link", onClick: () => select({ kind: "district", id: d.id }) }, "In " + d.name + " →"));
    }
    return h("aside", { className: "panel ui" + (open ? "" : " shut") },
      h("div", { className: "panel-head" },
        sel && h("button", { className: "back", onClick: close }, "← All districts"),
        h("button", { className: "toggle", "aria-label": open ? "Hide panel" : "Show panel", onClick: () => setOpen(!open) }, open ? "Hide" : "Show details")),
      open && h("div", { className: "panel-body" }, body));
  }

  function CivicBlock({ items, select }) {
    const groups = CIVIC_ORDER.map((t) => [t, items.filter(([p]) => p.type === t)]).filter(([, l]) => l.length);
    return h("div", { className: "civic" },
      groups.map(([t, l]) => h("details", { key: t, className: "cg t-" + t },
        h("summary", null, h("span", { className: "pin small" }, TYPE[t].glyph), h("span", { className: "cgl" }, TYPE[t].label), h("span", { className: "cgn" }, l.length)),
        h("ul", { className: "plist" }, l.map(([p, i]) => h("li", { key: i },
          h("button", { onClick: () => select({ kind: "poi", id: i }) }, h("span", null, h("span", { className: "pn" }, p.name), h("span", { className: "ps" }, p.note)))))))));
  }

  function Overview({ select }) {
    const total = G.districts.reduce((s, d) => s + d.area, 0);
    return h("div", { className: "card" },
      h("div", { className: "eyebrow" }, "Map v0.3"),
      h("h2", null, "Gidi"),
      h("p", { className: "lead" }, "An invented city with the feeling of Lagos. 15 districts merged from Lagos's 20 local governments, " + total.toFixed(1) + " km² of land around a lagoon. Click a district to see what we model there."),
      h("div", { className: "stats" },
        h("div", null, h("b", null, "15"), h("span", null, "districts")),
        h("div", null, h("b", null, total.toFixed(1)), h("span", null, "km² of land")),
        h("div", null, h("b", null, G.pois.length), h("span", null, "places on the map"))),
      ACT_ORDER.map((a) => h("section", { key: a },
        h("h3", { className: "acth a" + a }, ACT_NAME[a]),
        h("ul", { className: "dlist" }, G.districts.filter((d) => d.act === a).map((d) =>
          h("li", { key: d.id }, h("button", { onClick: () => select({ kind: "district", id: d.id }) },
            h("span", { className: "dl-name" }, d.name),
            h("span", { className: "dl-sub" }, d.inspired),
            h("span", { className: "dl-area" }, d.area.toFixed(1) + " km²"))))))),
      h("h3", null, "Civic life across Gidi"),
      h("div", { className: "civic-totals" }, CIVIC_ORDER.map((t) => { const n = G.pois.filter((p) => p.type === t).length; return n ? h("div", { key: t, className: "ct t-" + t },
        h("span", { className: "pin small" }, TYPE[t].glyph), h("span", null, TYPE[t].label), h("b", null, n)) : null; })),
      h("p", { className: "foot" }, "Churches, mosques, schools, hospitals and clinics are safe ground: part of daily life, never crime locations. Names are invented. Hatched areas: okada banned. Dashed outline: taskforce sweeps."));
  }

  function StudyBlock({ s, d }) {
    const byName = Object.fromEntries(G.districts.map((x) => [x.id, x.name]));
    const kinds = { main: "main road", arterial: "arterial", rail: "rail line", street: "street" };
    const links = {};
    s.links.forEach((g) => { (links[g.to] = links[g.to] || []).push(g.road ? g.road + " (" + kinds[g.kind] + ")" : "a " + kinds[g.kind] + " carries on"); });
    return h("div", { className: "study" },
      h("h3", null, "Town plan check"),
      h("p", { className: "ps" }, "Streets and houses here are generated from the measured pattern of " + d.inspired + ", not traced from a real map."),
      h("table", { className: "stbl" },
        h("thead", null, h("tr", null, h("th", null, ""), h("th", null, "Real, typical"), h("th", null, "Real, dense"), h("th", null, "Gidi"))),
        h("tbody", null, s.rows.map((r, i) => h("tr", { key: i }, r.map((c, j) => j ? h("td", { key: j }, c) : h("th", { key: j, scope: "row" }, c)))))),
      h("h3", null, "Roads to neighbours"),
      h("ul", { className: "links" }, Object.entries(links).map(([k, v]) => h("li", { key: k }, h("b", null, byName[k] || k), ": " + v.join(", ")))));
  }

  function District({ d, select }) {
    const places = G.pois.map((p, i) => [p, i]).filter(([p]) => p.d === d.id && !p.civic);
    const civic = G.pois.map((p, i) => [p, i]).filter(([p]) => p.d === d.id && p.civic);
    return h("div", { className: "card" },
      h("div", { className: "eyebrow" }, "District · inspired by " + d.inspired),
      h("h2", null, d.name),
      h("div", { className: "chiprow" },
        h("span", { className: "tag a" + d.act }, ACT_NAME[d.act]),
        h("span", { className: "tag ok-" + d.okada }, OKADA[d.okada].label),
        h("span", { className: "tag plain" }, d.area.toFixed(1) + " km²")),
      h("p", { className: "lead" }, d.blurb),
      h("dl", { className: "kv" }, h("dt", null, "Oja here"), h("dd", null, d.oja), h("dt", null, "Okada"), h("dd", null, OKADA[d.okada].note)),
      G.study && G.study[d.id] && h(StudyBlock, { s: G.study[d.id], d }),
      h("h3", null, "What to model"),
      h("ul", { className: "model" }, d.model.map((m, i) => h("li", { key: i }, m))),
      h("h3", null, "Between missions"),
      h("ul", { className: "acts" }, d.activities.map((m, i) => h("li", { key: i }, m))),
      h("h3", null, "Civic life (" + civic.length + ")"),
      h(CivicBlock, { items: civic, select }),
      h("h3", null, "Landmarks (" + places.length + ")"),
      h("ul", { className: "plist" }, places.map(([p, i]) => h("li", { key: i },
        h("button", { onClick: () => select({ kind: "poi", id: i }) },
          h("span", { className: "pin small t-" + p.type }, TYPE[p.type].glyph),
          h("span", null, h("span", { className: "pn" }, p.name), h("span", { className: "ps" }, p.note)))))));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
